# ================================
# SplitEasy API - main configuration
# ================================

spring.application.name=spliteasy-api

# --- Datasource (MySQL via XAMPP) ---
# Create the schema first: open phpMyAdmin (http://localhost/phpmyadmin) and run `CREATE DATABASE spliteasy;`
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spliteasy}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Schema is owned by Flyway migrations, never by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
# Override app.jwt.secret in production via the APP_JWT_SECRET environment variable (Base64, >= 256 bits).
app.jwt.secret=${APP_JWT_SECRET:b7ALXGbrm7a9vRmqjBZAJeK2McoiB7yTOavdQgQxoEiveBw4OHqRM62s7y7Qe2Kj}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging ---
logging.level.com.spliteasy=INFO
logging.level.org.hibernate.SQL=WARN
