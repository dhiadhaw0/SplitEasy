# ================================
# SplitEasy API - test configuration
# H2 in MySQL compatibility mode: no MySQL server needed to run the test suite.
# ================================

spring.datasource.url=jdbc:h2:mem:spliteasy_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1zcGxpdGVhc3ktdGVzdHMtb25seS0zODRiaXRz
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:4200

logging.level.com.spliteasy=INFO
logging.level.org.hibernate.SQL=WARN
