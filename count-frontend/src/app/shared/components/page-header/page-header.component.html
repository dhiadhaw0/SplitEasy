<header class="mb-4 flex items-center gap-2">
  @if (showBack()) {
    <button mat-icon-button type="button" aria-label="Retour" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
  }
  <div class="min-w-0 flex-1">
    <h1 class="m-0 truncate text-xl font-medium">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="m-0 text-sm text-[var(--se-color-neutral)]">{{ subtitle() }}</p>
    }
  </div>
  <div class="flex items-center gap-1">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
