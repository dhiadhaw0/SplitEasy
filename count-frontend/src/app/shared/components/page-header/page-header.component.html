<header [appAnimateIn]="0" class="mb-5 flex items-center gap-2">
  @if (showBack()) {
    <button
      mat-icon-button
      type="button"
      aria-label="Retour"
      class="se-pop !bg-black/[0.04] dark:!bg-white/[0.08]"
      (click)="goBack()"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
  }
  <div class="min-w-0 flex-1">
    <h1
      class="se-font-display m-0 truncate text-xl font-extrabold text-[var(--se-ink)] sm:text-2xl"
      [style.view-transition-name]="transitionName()"
    >{{ title() }}</h1>
    @if (subtitle()) {
      <p class="m-0 text-sm text-[var(--se-color-neutral)]">{{ subtitle() }}</p>
    }
  </div>
  <div class="flex items-center gap-1.5">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
