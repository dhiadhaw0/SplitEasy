<div [appAnimateIn]="0" class="flex flex-col items-center px-4 py-12 text-center text-[var(--se-color-neutral)]">
  <mat-icon class="mb-4 !h-14 !w-14 !text-5xl opacity-50" aria-hidden="true">{{ icon() }}</mat-icon>
  <h3 class="m-0 mb-1 text-base font-medium text-black/[0.87]">{{ title() }}</h3>
  @if (message()) {
    <p class="m-0 mb-4 max-w-xs">{{ message() }}</p>
  }
  @if (actionLabel()) {
    <button mat-flat-button color="primary" type="button" (click)="action.emit()">
      {{ actionLabel() }}
    </button>
  }
</div>
