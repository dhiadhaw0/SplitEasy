<span
  class="se-pop inline-flex flex-shrink-0 select-none items-center justify-center rounded-full font-semibold leading-none text-white shadow-md ring-2 ring-white/70 dark:ring-black/20"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.background-image]="gradient()"
  [style.font-size.px]="size() * 0.4"
  [attr.aria-label]="name()"
  role="img"
>{{ initials() }}</span>
