<span
  class="inline-flex flex-shrink-0 select-none items-center justify-center rounded-full font-semibold leading-none text-white shadow-sm"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.background-color]="backgroundColor()"
  [style.font-size.px]="size() * 0.4"
  [attr.aria-label]="name()"
  role="img"
>{{ initials() }}</span>
