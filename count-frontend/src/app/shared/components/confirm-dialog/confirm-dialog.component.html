<div
  class="se-dialog-header"
  [style.background-image]="isWarn ? 'linear-gradient(135deg, #ff5d8f, #ef4565)' : 'var(--se-gradient-brand)'"
>
  <span class="se-blob se-bounce-in flex h-11 w-11 flex-shrink-0 items-center justify-center bg-white/20">
    <mat-icon>{{ icon }}</mat-icon>
  </span>
  <h2 class="se-font-display m-0 text-lg font-extrabold">{{ data.title }}</h2>
</div>

<mat-dialog-content class="!pt-5">
  <p>{{ data.message }}</p>

  @if (data.numberField; as numberField) {
    <mat-form-field appearance="outline" class="mt-2 w-full">
      <mat-label>{{ numberField.label }}</mat-label>
      <input
        matInput
        type="number"
        [min]="numberField.min ?? 0.01"
        [step]="numberField.step ?? 0.01"
        [ngModel]="numberValue()"
        (ngModelChange)="onNumberValueChange($event)"
      />
    </mat-form-field>
  }

  @if (data.requireTypedText; as requiredText) {
    <mat-form-field appearance="outline" class="mt-2 w-full">
      <mat-label>Tapez "{{ requiredText }}" pour confirmer</mat-label>
      <input
        matInput
        type="text"
        [ngModel]="typedText()"
        (ngModelChange)="onTypedTextChange($event)"
      />
    </mat-form-field>
  }
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-5 !pe-6">
  <button mat-button type="button" class="se-pop !rounded-full" (click)="cancel()">{{ data.cancelLabel ?? 'Annuler' }}</button>
  <button
    mat-flat-button
    type="button"
    class="se-pop !rounded-full !px-6 !text-white"
    [style.background-image]="isWarn ? 'linear-gradient(135deg, #ff5d8f, #ef4565)' : 'var(--se-gradient-brand)'"
    [disabled]="!canConfirm()"
    (click)="confirm()"
  >
    {{ data.confirmLabel ?? 'Confirmer' }}
  </button>
</mat-dialog-actions>
