<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>

  @if (data.numberField; as numberField) {
    <mat-form-field appearance="outline" class="mt-2 w-full">
      <mat-label>{{ numberField.label }}</mat-label>
      <input
        matInput
        type="number"
        [min]="numberField.min ?? 0.01"
        [step]="numberField.step ?? 0.01"
        [ngModel]="numberValue()"
        (ngModelChange)="onNumberValueChange($event)"
      />
    </mat-form-field>
  }

  @if (data.requireTypedText; as requiredText) {
    <mat-form-field appearance="outline" class="mt-2 w-full">
      <mat-label>Tapez "{{ requiredText }}" pour confirmer</mat-label>
      <input
        matInput
        type="text"
        [ngModel]="typedText()"
        (ngModelChange)="onTypedTextChange($event)"
      />
    </mat-form-field>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ data.cancelLabel ?? 'Annuler' }}</button>
  <button
    mat-flat-button
    type="button"
    [color]="data.color ?? 'primary'"
    [disabled]="!canConfirm()"
    (click)="confirm()"
  >
    {{ data.confirmLabel ?? 'Confirmer' }}
  </button>
</mat-dialog-actions>
