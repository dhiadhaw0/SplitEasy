<mat-toolbar class="sticky top-0 z-[100] !text-white shadow-md" [style.background-image]="'var(--se-gradient-brand)'">
  <a routerLink="/groups" class="se-font-display flex items-center gap-2 text-lg font-extrabold text-inherit no-underline" aria-label="SplitEasy - Accueil">
    <span class="rounded-2xl flex h-9 w-9 items-center justify-center bg-white/20 shadow-md">
      <mat-icon class="!text-lg" aria-hidden="true">payments</mat-icon>
    </span>
    <span>SplitEasy</span>
  </a>

  <span class="se-spacer"></span>

  @if (authService.currentUser(); as user) {
    <button
      mat-icon-button
      type="button"
      [matMenuTriggerFor]="userMenu"
      class="se-pop !bg-white/15"
      [attr.aria-label]="'Menu de ' + user.displayName"
    >
      <app-participant-avatar [name]="user.displayName" [size]="32" />
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="flex flex-col gap-0.5 px-4 py-2 leading-tight">
        <strong>{{ user.displayName }}</strong>
        <span class="text-xs text-[var(--se-color-neutral)]">{{ user.email }}</span>
      </div>
      <button mat-menu-item type="button" (click)="themeService.toggle()">
        <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        <span>{{ themeService.theme() === 'dark' ? 'Mode clair' : 'Mode sombre' }}</span>
      </button>
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Se déconnecter</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
