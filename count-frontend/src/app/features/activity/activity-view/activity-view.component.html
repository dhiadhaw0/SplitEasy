<div class="se-page">
  <div class="mb-4 flex items-center gap-3">
    <span class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-2xl bg-[var(--se-accent-bg)] text-[var(--se-accent)]">
      <mat-icon>history</mat-icon>
    </span>
    <h1 class="se-font-display m-0 text-xl font-extrabold text-[var(--se-ink)] sm:text-2xl">Activité</h1>
  </div>

  @if (loading()) {
    <app-loading-spinner label="Chargement de l'activité…" />
  } @else if (error()) {
    <app-empty-state icon="error_outline" title="Oups !" [message]="error()!" />
  } @else if (activities().length === 0) {
    <app-empty-state
      icon="history"
      title="Aucune activité pour le moment"
      message="Les dépenses, remboursements et autres changements du groupe apparaîtront ici."
    />
  } @else {
    <div class="se-card flex flex-col divide-y divide-black/[0.06] overflow-hidden !shadow-none border border-black/[0.06] bg-[var(--se-surface)] dark:divide-white/10 dark:border-white/10">
      @for (activity of activities(); track activity.id; let i = $index) {
        <div [appAnimateIn]="i" class="flex items-start gap-3 px-4 py-3">
          <span class="mt-0.5 flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full bg-[var(--se-color-neutral-bg)] text-[var(--se-color-neutral)]">
            <mat-icon class="!text-lg">{{ icons[activity.type] }}</mat-icon>
          </span>
          <div class="min-w-0 flex-1">
            <p class="m-0 text-sm text-[var(--se-ink)]">{{ activity.message }}</p>
            <p class="m-0 text-xs text-[var(--se-color-neutral)]">{{ activity.createdAt | date: 'd MMM, HH:mm' }}</p>
          </div>
        </div>
      }
    </div>
  }
</div>
