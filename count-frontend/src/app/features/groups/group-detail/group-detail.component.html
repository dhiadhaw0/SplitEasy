@if (groupStore.loading()) {
  <app-loading-spinner label="Chargement du groupe…" />
} @else if (groupStore.error()) {
  <app-empty-state
    icon="error_outline"
    title="Oups !"
    [message]="groupStore.error()!"
    actionLabel="Réessayer"
    (action)="groupStore.reload()"
  />
} @else {
  @if (groupStore.group(); as group) {
    <div class="se-page group-detail">
      <app-page-header
        [title]="group.name"
        [subtitle]="subtitle()"
        [transitionName]="'group-title-' + group.id"
        backRoute="/groups"
      >
        <button actions mat-stroked-button type="button" (click)="shareInvite()">
          <mat-icon>share</mat-icon>
          Inviter
        </button>
      </app-page-header>

      <nav class="se-group-tabs mb-6 flex gap-1 overflow-x-auto rounded-full bg-[var(--se-color-neutral-bg)] p-1">
        @for (tab of tabs; track tab.path) {
          <a
            [routerLink]="tab.path"
            routerLinkActive
            #rla="routerLinkActive"
            class="se-pop flex flex-shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full px-4 py-2 text-sm font-semibold no-underline transition-colors"
            [class]="rla.isActive ? 'text-white shadow-md' : 'text-[var(--se-ink)] hover:bg-black/5 dark:hover:bg-white/10'"
            [style.background-image]="rla.isActive ? 'var(--se-gradient-brand)' : null"
          >
            <mat-icon class="!text-lg">{{ tab.icon }}</mat-icon>
            <span>{{ tab.label }}</span>
          </a>
        }
      </nav>
      <router-outlet />
    </div>
  }
}
