<div class="se-page">
  <div class="mb-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <span class="rounded-2xl flex h-11 w-11 flex-shrink-0 items-center justify-center text-white shadow-md" [style.background-image]="'var(--se-gradient-brand)'">
        <mat-icon>group</mat-icon>
      </span>
      <h1 class="se-font-display m-0 text-xl font-extrabold text-[var(--se-ink)] sm:text-2xl">Participants</h1>
    </div>
    <button
      mat-flat-button
      type="button"
      class="se-pop !rounded-lg !text-white"
      [style.background-image]="'var(--se-gradient-brand)'"
      (click)="openAddDialog()"
    >
      <mat-icon>person_add</mat-icon>
      Ajouter
    </button>
  </div>

  <div class="se-card flex flex-col divide-y divide-black/[0.06] overflow-hidden !shadow-none border border-black/[0.06] bg-[var(--se-surface)] dark:divide-white/10 dark:border-white/10">
    @for (participant of groupStore.participants(); track participant.id; let i = $index) {
      <div [appAnimateIn]="i" class="flex items-center gap-3 px-4 py-3">
        <app-participant-avatar [name]="participant.name" [size]="40" />

        <div class="flex min-w-0 flex-1 items-center gap-2">
          <span class="truncate font-medium">{{ participant.name }}</span>
          @if (isMe(participant)) {
            <mat-chip class="!min-h-[22px] !bg-[var(--se-color-positive-bg)] !text-xs !text-[var(--se-color-positive)]">Vous</mat-chip>
          } @else if (participant.linked) {
            <mat-chip class="!min-h-[22px] !text-xs">Compte lié</mat-chip>
          }
        </div>

        <div class="flex flex-shrink-0 items-center gap-1">
          <button mat-icon-button type="button" aria-label="Renommer" (click)="openRenameDialog(participant)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" aria-label="Supprimer" (click)="deleteParticipant(participant)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    }
  </div>
</div>
