<section class="mx-auto max-w-[1120px] px-4 py-16 sm:px-6">
  <div class="grid gap-10 lg:grid-cols-2 lg:items-center">
    <div>
      <h2 class="se-font-display max-w-[18ch] text-3xl font-extrabold text-[var(--se-ink)] sm:text-4xl">
        {{ 'problem.title' | transloco }}
      </h2>
      <p class="mt-4 max-w-[52ch] text-base leading-relaxed text-[var(--se-muted)]">
        {{ 'problem.text' | transloco }}
      </p>
    </div>

    <div class="flex flex-col gap-2">
      <div class="max-w-[80%] self-start rounded-2xl rounded-ss-sm bg-[var(--se-color-neutral-bg)] px-4 py-2.5 text-sm text-[var(--se-ink)]">
        {{ 'problem.bubble1' | transloco }}
      </div>
      <div class="max-w-[80%] self-start rounded-2xl rounded-ss-sm bg-[var(--se-color-neutral-bg)] px-4 py-2.5 text-sm text-[var(--se-ink)]">
        {{ 'problem.bubble2' | transloco }}
      </div>
      <div class="max-w-[80%] self-end rounded-2xl rounded-ee-sm bg-[var(--se-mint-bg)] px-4 py-2.5 text-sm text-[var(--se-ink)]">
        {{ 'problem.bubble3' | transloco }}
      </div>
      <div class="mt-2 max-w-[80%] self-end rounded-2xl rounded-ee-sm bg-[var(--se-teal)] px-4 py-2.5 text-sm font-semibold text-white">
        {{ 'problem.bubbleFinal' | transloco }}
      </div>
    </div>
  </div>
</section>
