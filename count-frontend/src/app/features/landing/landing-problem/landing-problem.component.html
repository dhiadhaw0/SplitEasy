<section class="bg-[var(--se-color-neutral-bg)] py-20">
  <div class="mx-auto grid max-w-[1120px] gap-12 px-4 sm:px-6 lg:grid-cols-2 lg:items-center">
    <div [appAnimateIn]="0">
      <h2 class="se-font-display max-w-[18ch] text-3xl font-extrabold leading-tight text-[var(--se-ink)] sm:text-4xl">
        {{ 'problem.title' | transloco }}
      </h2>
      <p class="mt-5 max-w-[52ch] text-base leading-relaxed text-[var(--se-muted)]">
        {{ 'problem.text' | transloco }}
      </p>
    </div>

    <div class="flex flex-col gap-3 py-4">
      <div [appAnimateIn]="1" class="max-w-[78%] self-start rounded-2xl rounded-ss-md bg-[var(--se-surface)] px-5 py-3 text-sm font-medium text-[var(--se-ink)] shadow-sm">
        {{ 'problem.bubble1' | transloco }}
      </div>
      <div [appAnimateIn]="2" class="max-w-[78%] self-start rounded-2xl rounded-ss-md bg-[var(--se-surface)] px-5 py-3 text-sm font-medium text-[var(--se-ink)] shadow-sm">
        {{ 'problem.bubble2' | transloco }}
      </div>
      <div [appAnimateIn]="3" class="max-w-[78%] self-end rounded-2xl rounded-ee-md bg-[var(--se-accent-bg)] px-5 py-3 text-end text-sm font-medium text-[var(--se-ink)] shadow-sm">
        {{ 'problem.bubble3' | transloco }}
      </div>
      <div
        [appAnimateIn]="4"
        class="flex max-w-[78%] items-center gap-2 self-end rounded-2xl rounded-ee-md bg-[var(--se-accent)] px-5 py-3 text-end text-sm font-semibold text-white shadow-sm"
      >
        {{ 'problem.bubbleFinal' | transloco }}
      </div>
    </div>
  </div>
</section>
