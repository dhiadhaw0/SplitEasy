<section class="bg-[var(--se-mint-bg)]">
  <div class="mx-auto grid max-w-[1120px] gap-10 px-4 py-16 sm:px-6 lg:grid-cols-[3fr_2fr] lg:items-center">
    <div class="rounded-[28px] bg-[var(--illustration-stage)] p-6">
      <img
        src="/illustrations/settle.svg"
        [attr.alt]="'settle.imageAlt' | transloco"
        width="400"
        height="300"
        loading="lazy"
        class="block h-auto w-full"
      />
    </div>

    <div>
      <h2 class="se-font-display text-3xl font-extrabold text-[var(--se-ink)] sm:text-4xl">{{ 'settle.title' | transloco }}</h2>
      <p class="mt-4 max-w-[46ch] text-base leading-relaxed text-[var(--se-muted)]">{{ 'settle.text' | transloco }}</p>
    </div>
  </div>
</section>
