<section id="faq" class="mx-auto max-w-[760px] px-4 py-20 sm:px-6">
  <div class="text-center">
    <span class="inline-flex items-center gap-1.5 rounded-full bg-[var(--se-teal-bg)] px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-[var(--se-teal)]">
      <mat-icon class="!text-sm" inline>help</mat-icon>
      {{ 'faq.title' | transloco }}
    </span>
    <h2 class="se-font-display mt-4 text-3xl font-extrabold text-[var(--se-ink)] sm:text-4xl">{{ 'faq.title' | transloco }}</h2>
  </div>

  <mat-accordion class="se-faq-accordion mt-10 block">
    @for (item of items; track item.n; let i = $index) {
      <mat-expansion-panel [appAnimateIn]="i" class="se-faq-panel">
        <mat-expansion-panel-header class="!h-auto !py-4">
          <mat-panel-title class="items-center gap-3">
            <span class="rounded-2xl flex h-9 w-9 flex-shrink-0 items-center justify-center text-white" [style.background-image]="item.accent">
              <mat-icon class="!text-lg">{{ item.icon }}</mat-icon>
            </span>
            <span class="se-font-display !font-bold !text-[var(--se-ink)]">{{ 'faq.q' + item.n | transloco }}</span>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <p class="ms-12 text-sm leading-relaxed text-[var(--se-muted)]">{{ 'faq.a' + item.n | transloco }}</p>
      </mat-expansion-panel>
    }
  </mat-accordion>
</section>
