<section class="se-tilt-down relative overflow-hidden px-4 py-24 text-center sm:px-6" [style.background-image]="'var(--se-gradient-brand)'">
  <div class="se-float se-blob pointer-events-none absolute -top-16 start-1/4 h-64 w-64 bg-white opacity-10 blur-3xl" aria-hidden="true"></div>
  <div class="se-float se-blob-alt pointer-events-none absolute -bottom-20 end-1/4 h-72 w-72 bg-[var(--se-sun)] opacity-20 blur-3xl [animation-delay:-1s]" aria-hidden="true"></div>

  <div class="relative z-[1] mx-auto max-w-[640px]">
    <span class="se-sticker se-float mb-5 inline-flex h-16 w-16 items-center justify-center rounded-full bg-white/15 text-3xl backdrop-blur-sm">🎉</span>
    <h2 class="se-font-display text-3xl font-extrabold leading-tight text-white sm:text-5xl">{{ 'finalCta.title' | transloco }}</h2>

    <div class="mt-9">
      @if (authService.isLoggedIn()) {
        <a routerLink="/groups" mat-flat-button class="se-pop !h-14 !rounded-full !bg-[var(--se-sun)] !px-10 !text-base !font-bold !text-[var(--se-ink)]">
          {{ 'nav.openGroups' | transloco }}
        </a>
      } @else {
        <a routerLink="/register" mat-flat-button class="se-pop !h-14 !rounded-full !bg-[var(--se-sun)] !px-10 !text-base !font-bold !text-[var(--se-ink)]">
          {{ 'finalCta.cta' | transloco }}
        </a>
      }
    </div>

    <p class="mt-5 flex items-center justify-center gap-1.5 text-sm text-white/80">
      <mat-icon class="!text-base" inline>check_circle</mat-icon>
      {{ 'finalCta.reassurance' | transloco }}
    </p>
  </div>
</section>
