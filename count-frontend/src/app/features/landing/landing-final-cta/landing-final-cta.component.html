<section class="bg-[var(--se-accent)] px-4 py-24 text-center sm:px-6">
  <div class="mx-auto max-w-[640px]">
    <h2 class="se-font-display text-3xl font-extrabold leading-tight text-white sm:text-5xl">{{ 'finalCta.title' | transloco }}</h2>

    <div class="mt-9">
      @if (authService.isLoggedIn()) {
        <a routerLink="/groups" mat-flat-button class="!h-14 !rounded-lg !bg-white !px-10 !text-base !font-semibold !text-[var(--se-accent)]">
          {{ 'nav.openGroups' | transloco }}
        </a>
      } @else {
        <a routerLink="/register" mat-flat-button class="!h-14 !rounded-lg !bg-white !px-10 !text-base !font-semibold !text-[var(--se-accent)]">
          {{ 'finalCta.cta' | transloco }}
        </a>
      }
    </div>

    <p class="mt-5 flex items-center justify-center gap-1.5 text-sm text-white/80">
      <mat-icon class="!text-base" inline>check_circle</mat-icon>
      {{ 'finalCta.reassurance' | transloco }}
    </p>
  </div>
</section>
