<section id="steps" class="relative mx-auto max-w-[720px] px-4 py-20 sm:px-6">
  <div class="text-center">
    <span class="inline-flex items-center gap-1.5 rounded-full bg-[var(--se-accent-bg)] px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-[var(--se-accent)]">
      <mat-icon class="!text-sm" inline>route</mat-icon>
      {{ 'steps.title' | transloco }}
    </span>
    <h2 class="se-font-display mt-4 text-3xl font-extrabold text-[var(--se-ink)] sm:text-4xl">{{ 'steps.title' | transloco }}</h2>
  </div>

  <div #track class="relative mt-16 flex flex-col gap-16">
    <!-- Static track behind the badges, full height of the steps stack. -->
    <div class="pointer-events-none absolute start-[26px] top-1 bottom-1 w-1 rounded-full bg-[var(--se-color-neutral-bg)]" aria-hidden="true"></div>
    <!-- Gradient fill, grown top-to-bottom by GSAP ScrollTrigger as the user scrolls past this
         section — a static page doesn't get to show "progress", this does. -->
    <div
      #lineFill
      class="pointer-events-none absolute start-[26px] top-1 bottom-1 w-1 origin-top scale-y-0 rounded-full"
      [style.background-image]="'var(--se-gradient-brand)'"
      aria-hidden="true"
    ></div>

    @for (step of steps; track step.number) {
      <div [appAnimateIn]="step.number - 1" class="relative z-[1] flex items-start gap-5">
        <div
          class="rounded-2xl relative flex h-14 w-14 flex-shrink-0 items-center justify-center text-white shadow-lg"
          [style.background-image]="step.bg"
        >
          <mat-icon class="!text-2xl">{{ step.icon }}</mat-icon>
          <span class="se-font-display absolute -end-1.5 -top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-[var(--se-surface)] text-xs font-extrabold text-[var(--se-ink)] shadow-md">
            {{ step.number }}
          </span>
        </div>
        <div class="pt-2">
          <h3 class="se-font-display text-lg font-bold text-[var(--se-ink)]">{{ step.titleKey | transloco }}</h3>
          <p class="mt-1.5 max-w-[44ch] text-sm leading-relaxed text-[var(--se-muted)]">{{ step.textKey | transloco }}</p>
        </div>
      </div>
    }
  </div>
</section>
