<header class="sticky top-0 z-[100] border-b border-black/[0.06] bg-[var(--se-surface)]/90 backdrop-blur dark:border-white/10">
  <div class="mx-auto flex max-w-[1120px] items-center gap-4 px-4 py-3 sm:px-6">
    <a routerLink="/" class="se-font-display flex items-center gap-2 text-lg font-extrabold text-[var(--se-ink)] no-underline">
      <span class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--se-teal)] text-white">
        <mat-icon class="!text-lg">payments</mat-icon>
      </span>
      {{ 'app.name' | transloco }}
    </a>

    <nav class="hidden flex-1 items-center justify-center gap-6 text-sm font-semibold text-[var(--se-ink)] md:flex">
      <a href="#features" (click)="scrollTo($event, 'features')" class="no-underline hover:text-[var(--se-teal)]">
        {{ 'nav.features' | transloco }}
      </a>
      <a href="#steps" (click)="scrollTo($event, 'steps')" class="no-underline hover:text-[var(--se-teal)]">
        {{ 'nav.howItWorks' | transloco }}
      </a>
      <a href="#faq" (click)="scrollTo($event, 'faq')" class="no-underline hover:text-[var(--se-teal)]">
        {{ 'nav.faq' | transloco }}
      </a>
    </nav>

    <div class="ms-auto flex items-center gap-1 sm:gap-2">
      <app-language-switcher />
      <app-theme-toggle />
      <a routerLink="/login" mat-button class="hidden sm:inline-flex">{{ 'nav.login' | transloco }}</a>

      @if (authService.isLoggedIn()) {
        <a routerLink="/groups" mat-flat-button class="!bg-[var(--se-sun)] !text-[var(--se-ink)]">
          {{ 'nav.openGroups' | transloco }}
        </a>
      } @else {
        <a routerLink="/register" mat-flat-button class="!bg-[var(--se-sun)] !text-[var(--se-ink)]">
          {{ 'nav.createFirstGroup' | transloco }}
        </a>
      }
    </div>
  </div>
</header>
