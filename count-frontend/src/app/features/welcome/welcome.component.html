<div class="flex min-h-screen flex-col items-center justify-center gap-12 bg-[var(--se-bg)] px-6 py-10 text-center">
  <div [appAnimateIn]="0" class="flex flex-col items-center">
    <span class="mb-6 flex h-20 w-20 items-center justify-center rounded-2xl bg-[var(--se-accent)] text-white shadow-sm">
      <mat-icon class="!h-10 !w-10 !text-[40px]">payments</mat-icon>
    </span>
    <h1 class="se-font-display text-3xl font-extrabold text-[var(--se-ink)]">SplitEasy</h1>
    <p class="mt-2 max-w-[26ch] text-base text-[var(--se-muted)]">Les bons comptes font les bons amis.</p>
  </div>

  <div [appAnimateIn]="1" class="flex w-full max-w-[360px] flex-col gap-3">
    <a
      routerLink="/register"
      mat-flat-button
      class="!h-12 !rounded-lg !bg-[var(--se-accent)] !text-base !font-semibold !text-white"
    >
      Créer un compte
    </a>
    <a
      routerLink="/login"
      mat-stroked-button
      class="!h-12 !rounded-lg !border !border-[var(--se-color-neutral)] !text-base !font-semibold !text-[var(--se-ink)]"
    >
      Se connecter
    </a>
    <p class="mt-3 text-xs text-[var(--se-muted)]">Gratuit. Vos amis n'ont même pas besoin de compte.</p>
  </div>
</div>
