  <!--
    Static baseline so link-preview bots (WhatsApp, Slack, iMessage, LinkedIn…) get a real
    title/description/image: most of them fetch this file and never execute JS, so the
    locale-aware tags LandingComponent sets via Angular's Meta service (see landing.component.ts)
    never reach them — only a real user's browser, after the app has bootstrapped, sees those.
    This French baseline is what a crawler or a non-JS fetch actually gets.
  -->
  <meta name="description" content="Notez vos dépenses de groupe en quelques secondes. SplitEasy calcule qui doit quoi et vous dit comment tout régler avec le moins de virements possible.">
