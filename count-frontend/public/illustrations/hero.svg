<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="t">
  <title id="t">Deux amis partagent leurs dépenses de vacances sur l'application SplitEasy</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1D2A3A" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    text { font-family: Nunito, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>

  <!-- Fonds organiques -->
  <path d="M400 40 C560 30 700 120 700 280 C700 440 580 540 400 540 C220 540 100 450 100 290 C100 130 240 50 400 40 Z" fill="#E6F2F1"/>
  <circle cx="660" cy="130" r="70" fill="#FDEFC3"/>
  <circle cx="120" cy="470" r="46" fill="#FDEFC3"/>
  <ellipse cx="400" cy="548" rx="300" ry="12" fill="#1D2A3A" opacity="0.06"/>

  <!-- Téléphone -->
  <g filter="url(#shadow)">
    <rect x="290" y="56" width="220" height="468" rx="34" fill="#1D2A3A"/>
    <rect x="302" y="68" width="196" height="444" rx="26" fill="#FFFFFF"/>
  </g>
  <!-- En-tête du groupe -->
  <path d="M302 94 A26 26 0 0 1 328 68 L472 68 A26 26 0 0 1 498 94 L498 150 L302 150 Z" fill="#0F5E5C"/>
  <rect x="370" y="76" width="60" height="6" rx="3" fill="#1D2A3A" opacity="0.5"/>
  <text x="318" y="112" font-size="15" font-weight="800" fill="#FFFFFF">Week-end à la mer</text>
  <text x="318" y="134" font-size="11" fill="#7FD1B9">4 participants, 425,50 TND</text>

  <!-- Dépenses -->
  <g font-size="12" class="se-hero-expense-lines">
    <g class="se-hero-line se-hero-line-1">
      <circle cx="332" cy="176" r="14" fill="#FDEFC3"/>
      <path d="M326 170 L326 182 M332 170 L332 182 M338 170 Q341 176 338 182" stroke="#B8860B" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="354" y="174" font-weight="700" fill="#1D2A3A">Restaurant</text>
      <text x="354" y="189" font-size="10" fill="#6B7C8F">Payé par Sara</text>
      <text x="484" y="180" text-anchor="end" font-weight="700" fill="#1D2A3A">120,00</text>
      <line x1="318" y1="202" x2="484" y2="202" stroke="#EEF2F5"/>
    </g>

    <g class="se-hero-line se-hero-line-2">
      <circle cx="332" cy="226" r="14" fill="#E6F2F1"/>
      <rect x="325" y="220" width="10" height="13" rx="2" fill="none" stroke="#0F5E5C" stroke-width="2"/>
      <path d="M335 224 L339 227 L339 233" stroke="#0F5E5C" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="354" y="224" font-weight="700" fill="#1D2A3A">Essence</text>
      <text x="354" y="239" font-size="10" fill="#6B7C8F">Payé par Ali</text>
      <text x="484" y="230" text-anchor="end" font-weight="700" fill="#1D2A3A">65,50</text>
      <line x1="318" y1="252" x2="484" y2="252" stroke="#EEF2F5"/>
    </g>

    <g class="se-hero-line se-hero-line-3">
      <circle cx="332" cy="276" r="14" fill="#FDE3E4"/>
      <path d="M323 280 L341 280 L337 286 L327 286 Z M332 268 L332 280 M332 268 L339 276 L332 276" stroke="#D9474D" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      <text x="354" y="274" font-weight="700" fill="#1D2A3A">Bateau</text>
      <text x="354" y="289" font-size="10" fill="#6B7C8F">Payé par Omar</text>
      <text x="484" y="280" text-anchor="end" font-weight="700" fill="#1D2A3A">240,00</text>
    </g>
  </g>

  <!-- Carte des soldes -->
  <rect x="314" y="310" width="172" height="128" rx="14" fill="#F2F8F7"/>
  <text x="326" y="333" font-size="12" font-weight="800" fill="#1D2A3A">Qui doit quoi ?</text>
  <line x1="420" y1="344" x2="420" y2="426" stroke="#C9D6DC" stroke-dasharray="3 3"/>
  <g font-size="10" fill="#1D2A3A" class="se-hero-balance-bars">
    <text x="326" y="356">Sara</text>
    <rect class="se-hero-bar se-hero-bar-1" x="420" y="348" width="42" height="10" rx="5" fill="#22A884"/>
    <text x="326" y="376">Ali</text>
    <rect class="se-hero-bar se-hero-bar-2" x="388" y="368" width="32" height="10" rx="5" fill="#F2767A"/>
    <text x="326" y="396">Omar</text>
    <rect class="se-hero-bar se-hero-bar-3" x="420" y="388" width="58" height="10" rx="5" fill="#22A884"/>
    <text x="326" y="416">Lina</text>
    <rect class="se-hero-bar se-hero-bar-4" x="366" y="408" width="54" height="10" rx="5" fill="#F2767A"/>
  </g>

  <!-- Bouton -->
  <rect x="314" y="452" width="172" height="38" rx="19" fill="#F6C945"/>
  <text x="400" y="475" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1D2A3A">Voir les remboursements</text>

  <!-- Notification flottante -->
  <g filter="url(#shadow)">
    <rect x="528" y="84" width="236" height="62" rx="16" fill="#FFFFFF"/>
  </g>
  <circle cx="556" cy="115" r="16" fill="#7FD1B9"/>
  <text x="556" y="120" text-anchor="middle" font-size="13" font-weight="800" fill="#0F5E5C">A</text>
  <text x="582" y="111" font-size="12" font-weight="700" fill="#1D2A3A">Ali a ajouté Essence</text>
  <text x="582" y="128" font-size="10.5" fill="#6B7C8F">il y a 2 min, 65,50 TND</text>

  <!-- Personnage gauche (Sara) -->
  <g>
    <path d="M96 520 C96 400 118 340 164 340 C210 340 232 400 232 520 Z" fill="#F2767A"/>
    <rect x="154" y="296" width="20" height="50" rx="8" fill="#C68B59"/>
    <circle cx="164" cy="222" r="17" fill="#2B1D16"/>
    <circle cx="164" cy="270" r="38" fill="#C68B59"/>
    <path d="M125 268 C122 232 146 222 166 223 C190 224 206 240 203 268 C194 252 180 246 164 247 C148 248 134 255 125 268 Z" fill="#2B1D16"/>
    <circle cx="151" cy="274" r="3.2" fill="#1D2A3A"/>
    <circle cx="177" cy="274" r="3.2" fill="#1D2A3A"/>
    <path d="M152 288 Q164 298 176 288" stroke="#1D2A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="143" cy="286" r="5" fill="#E07B6A" opacity="0.45"/>
    <circle cx="185" cy="286" r="5" fill="#E07B6A" opacity="0.45"/>
  <!-- Ticket tenu par Sara -->
  <g transform="translate(4 38) rotate(-10 250 200)" filter="url(#shadow)">
    <path d="M220 150 L282 150 L282 238 L274 232 L266 238 L258 232 L250 238 L242 232 L234 238 L226 232 L220 238 Z" fill="#FFFFFF"/>
  </g>
  <g transform="translate(4 38) rotate(-10 250 200)">
    <rect x="230" y="162" width="30" height="5" rx="2.5" fill="#C9D6DC"/>
    <rect x="230" y="174" width="42" height="4" rx="2" fill="#E3EAEE"/>
    <rect x="230" y="184" width="36" height="4" rx="2" fill="#E3EAEE"/>
    <rect x="230" y="194" width="40" height="4" rx="2" fill="#E3EAEE"/>
    <rect x="230" y="210" width="42" height="7" rx="3.5" fill="#0F5E5C"/>
  </g>

    <!-- bras levé -->
    <path d="M206 372 L246 262" stroke="#F2767A" stroke-width="26" stroke-linecap="round"/>
    <path d="M232 300 L252 244" stroke="#C68B59" stroke-width="17" stroke-linecap="round"/>
  </g>
  <!-- Personnage droit (Omar) -->
  <g>
    <path d="M572 520 C572 405 596 350 642 350 C688 350 712 405 712 520 Z" fill="#7FD1B9"/>
    <rect x="632" y="306" width="20" height="50" rx="8" fill="#8D5A3B"/>
    <circle cx="642" cy="282" r="37" fill="#8D5A3B"/>
    <path d="M605 276 C603 244 624 230 644 230 C667 230 683 245 679 274 C671 258 658 252 642 253 C626 254 613 262 605 276 Z" fill="#1D2A3A"/>
    <circle cx="629" cy="286" r="3.2" fill="#1D2A3A"/>
    <circle cx="655" cy="286" r="3.2" fill="#1D2A3A"/>
    <path d="M630 299 Q642 309 654 299" stroke="#1D2A3A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- bras qui tend une pièce -->
    <path d="M590 390 L556 322" stroke="#7FD1B9" stroke-width="26" stroke-linecap="round"/>
    <path d="M566 342 L548 300" stroke="#8D5A3B" stroke-width="17" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="544" cy="278" r="22" fill="#F6C945"/>
  </g>
  <circle cx="544" cy="278" r="16" fill="none" stroke="#E0AE1F" stroke-width="2"/>
  <text x="544" y="283" text-anchor="middle" font-size="12" font-weight="800" fill="#7A5A00">DT</text>

  <!-- Pièces décoratives -->
  <circle cx="96" cy="140" r="22" fill="#F6C945"/>
  <text x="96" y="147" text-anchor="middle" font-size="18" font-weight="800" fill="#7A5A00">€</text>
  <circle cx="742" cy="400" r="17" fill="#F6C945"/>
  <text x="742" y="406" text-anchor="middle" font-size="15" font-weight="800" fill="#7A5A00">$</text>

  <!-- Petites étincelles -->
  <g stroke="#0F5E5C" stroke-width="3" stroke-linecap="round">
    <path d="M540 200 L540 214 M533 207 L547 207"/>
    <path d="M232 420 L232 432 M226 426 L238 426" stroke="#F6C945"/>
    <path d="M150 92 L150 102 M145 97 L155 97"/>
  </g>
</svg>
